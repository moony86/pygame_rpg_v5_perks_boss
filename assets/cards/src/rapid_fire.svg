<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Gunslinger: Fire Rate Boost - ثلاث رصاصات متتابعة مع خطوط سرعة -->
  <circle cx="128" cy="128" r="116" fill="none" stroke="#EBB428" stroke-opacity="0.12" stroke-width="8"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="#EBB428" stroke-opacity="0.25" stroke-width="5"/>
  <circle cx="128" cy="128" r="104" fill="#0E101C"/>
  <circle cx="128" cy="128" r="94" fill="#151A30"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#EBB428" stroke-width="6"/>

  <!-- خطوط السرعة -->
  <g stroke="#EBB428" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round">
    <line x1="52" y1="96" x2="82" y2="96"/>
    <line x1="40" y1="128" x2="72" y2="128"/>
