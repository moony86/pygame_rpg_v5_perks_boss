      <line x1="112" y1="119" x2="112" y2="137" stroke="#0E101C" stroke-width="4"/>
    </g>
    <g transform="translate(0,32)">
      <path d="M96 151 H138 Q164 151 178 160 Q164 169 138 169 H96 Z" fill="#EBB428" stroke="#FFE58A" stroke-width="5"/>
      <line x1="112" y1="151" x2="112" y2="169" stroke="#0E101C" stroke-width="4"/>
    </g>
  </g>
  <!-- لمعة -->
  <circle cx="170" cy="92" r="4" fill="#FFFFFF" fill-opacity="0.9"/>
